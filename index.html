
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>COIN SELL BD - Premium</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { --blue: #0088cc; --green: #00c853; --red: #ff3d00; --gold: #ffd700; --bg: #f8fbff; --input-bg: #ffffff; }
        body { font-family: 'Poppins', 'Hind Siliguri', sans-serif; background: var(--bg); margin: 0; padding: 15px; overflow-x: hidden; }
        
        /* Premium Cards */
        .card { background: white; padding: 30px; border-radius: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.04); margin-bottom: 15px; }
        
        /* Balance Section - Now Set to 0.00 */
        .balance-card { background: linear-gradient(135deg, #0088cc, #0055ff); color: white; padding: 25px; border-radius: 25px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 8px 20px rgba(0,136,204,0.3); }
        .bal-val { font-size: 26px; font-weight: 800; }
        
        /* Extra Large & Styled Inputs */
        input, select { 
            width: 100%; 
            padding: 20px; /* আরও বড় করা হয়েছে */
            margin: 15px 0; 
            border: 2px solid #e0e6ed; 
            border-radius: 20px; 
            font-size: 17px; 
            background: #fdfdfe; 
            box-sizing: border-box; 
            transition: 0.3s;
            color: #2c3e50;
            font-weight: 600;
        }
        input:focus, select:focus { border-color: var(--blue); outline: none; background: #fff; box-shadow: 0 5px 15px rgba(0,136,204,0.1); }
        label { font-weight: 700; font-size: 15px; color: #444; margin-left: 8px; display: block; }

        /* Animation Overlay (2 Seconds Fixed) */
        .space-modal { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background: #0b0e14; z-index: 2000; align-items: center; justify-content: center; flex-direction: column; color: white; text-align: center; }
        .planet { width: 90px; height: 90px; background: radial-gradient(circle at 30% 30%, #4facfe, #00f2fe); border-radius: 50%; box-shadow: 0 0 50px #4facfe; animation: travel 2s ease-in-out infinite; }
        @keyframes travel { 0% { transform: scale(0.5) translateX(-120px); opacity:0; } 50% { transform: scale(1.3) translateX(0); opacity:1; } 100% { transform: scale(0.5) translateX(120px); opacity:0; } }

        .active-screen { display: block; animation: fadeIn 0.4s; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .btn { width: 100%; padding: 20px; border: none; border-radius: 20px; font-size: 17px; font-weight: 700; cursor: pointer; margin-top: 10px; transition: 0.3s; }
        .btn-blue { background: var(--blue); color: white; }
        .btn-green { background: var(--green); color: white; }
        
        /* Target Username Box */
        .transfer-box { background: #f0f7ff; padding: 25px; border-radius: 20px; margin: 15px 0; border: 2px dashed var(--blue); text-align: center; }
    </style>
</head>
<body>

    <div id="spaceTransition" class="space-modal">
        <div id="animIcon" class="planet"></div>
        <p id="animText" style="margin-top:25px; letter-spacing: 2px; font-weight: 600;">প্রসেসিং হচ্ছে...</p>
    </div>

    <div id="homeScreen" class="screen active-screen">
        <div class="balance-card">
            <div><small style="opacity:0.9">বর্তমান ব্যালেন্স</small><div class="bal-val" id="dispBal">৳ 0.00</div></div>
            <div style="text-align:right"><small style="opacity:0.9">উইথড্র</small><div class="bal-val">৳ 0.00</div></div>
        </div>

        <button class="btn btn-blue" style="margin-top: 30px;" onclick="showScreenWithSpace('sellScreen', 'সেলিং প্ল্যানেটে যাচ্ছি...')">SELL COIN NOW</button>
        <button class="btn btn-blue" style="background:#fff; color:var(--blue); border:2px solid var(--blue);" onclick="showScreenWithSpace('withdrawScreen', 'উইথড্র প্ল্যানেটে যাচ্ছি...')">WITHDRAW NOW</button>
    </div>

    <div id="sellScreen" class="screen" style="display:none;">
        <div class="card">
            <h3 style="text-align:center;">কয়েন সেল করুন</h3>
            <label>কয়েন নির্বাচন করুন</label>
            <select id="coinSelect" onchange="updateSellUI()">
                <option value="5.60">NIVA COIN</option>
                <option value="5.60">TOP COIN</option>
                <option value="14.00">NS COIN</option>
            </select>
            
            <div class="transfer-box">
                <small>এই ঠিকানায় কয়েন পাঠান:</small><br>
                <b id="targetUser" style="font-size:24px; color:var(--blue); display: block; margin: 10px 0;">niva_coin_eh</b> 
                <button class="btn" style="padding:10px; font-size:12px; width:auto; background:#e3f2fd; color:var(--blue);" onclick="copyUser()">COPY USERNAME</button>
            </div>

            <input type="number" id="sellQty" placeholder="কত কয়েন সেল করবেন? (Min 10,000)">
            <input type="text" id="sellUser" placeholder="আপনার ইউজারনেম দিন">
            
            <button class="btn btn-blue" onclick="showSellPreview()">পরবর্তী ধাপে যান</button>
            <button class="btn" style="background:#eee;" onclick="showScreenWithSpace('homeScreen', 'হোমে ফিরছি...')">Back</button>
        </div>
    </div>

    <div id="withdrawScreen" class="screen" style="display:none;">
        <div class="card">
            <div style="background: #e3f2fd; padding: 20px; border-radius: 15px; margin-bottom: 15px; text-align: center; font-weight: 800;">আপনার ব্যালেন্স: <span style="color:var(--blue);">৳ 0.00</span></div>
            <label>উইথড্র মেথড</label>
            <select id="wMethod" onchange="updateWithdrawUI()">
                <option value="bkash">Bkash Personal (Charge 3%)</option>
                <option value="rocket">Rocket Personal (Charge 1.5%)</option>
            </select>
            <input type="number" id="wAmount" placeholder="টাকার পরিমান">
            <input type="text" id="wNumber" placeholder="বিকাশ/রকেট নাম্বার">
            <button class="btn btn-blue" onclick="finalWithdraw()">Confirm Withdraw</button>
            <button class="btn" style="background:#eee;" onclick="showScreenWithSpace('homeScreen', 'হোমে ফিরছি...')">Back</button>
        </div>
    </div>

    <script>
        let userBalance = 0.00; // ব্যালেন্স এখন ০.০০

        function showScreenWithSpace(screenId, text) {
            const space = document.getElementById('spaceTransition');
            document.getElementById('animText').innerText = text;
            space.style.display = 'flex';
            setTimeout(() => {
                space.style.display = 'none';
                document.querySelectorAll('.screen').forEach(s => s.style.display = 'none');
                document.getElementById(screenId).style.display = 'block';
            }, 2000); // ২ সেকেন্ড পপ-আপ টাইম
        }

        function copyUser() {
            const user = document.getElementById('targetUser').innerText;
            navigator.clipboard.writeText(user);
            alert("Username Copied!");
        }

        function updateSellUI() {
            const coin = document.getElementById('coinSelect');
            const target = document.getElementById('targetUser');
            if(coin.value == "14.00") target.innerText = "ns_coin_eh";
            else if(coin.options[coin.selectedIndex].text == "TOP COIN") target.innerText = "VOUCHER_MODE";
            else target.innerText = "niva_coin_eh";
        }

        function finalWithdraw() {
            const amt = parseFloat(document.getElementById('wAmount').value);
            if(amt > userBalance || userBalance <= 0) return alert("পর্যাপ্ত ব্যালেন্স নেই!");
            
            showScreenWithSpace('homeScreen', 'উইথড্র রিকোয়েস্ট পাঠানো হচ্ছে...');
            setTimeout(() => alert("অনুরোধ সফল হয়েছে!"), 2100);
        }

        function showSellPreview() {
            const qty = document.getElementById('sellQty').value;
            if(qty < 10000) return alert("মিনিমাম ১০,০০০ কয়েন লাগবে!");
            showScreenWithSpace('homeScreen', 'তথ্য যাচাই করা হচ্ছে...');
            setTimeout(() => alert("রিকোয়েস্ট সফল! আমাদের প্রতিনিধি এটি চেক করে ব্যালেন্স যোগ করে দিবে।"), 2100);
        }
    </script>
</body>
</html>
