<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>COIN SELL BD - Premium</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { --blue: #0088cc; --green: #00c853; --red: #ff3d00; --gold: #ffd700; --bg: #f8fbff; --input-bg: #ffffff; }
        body { font-family: 'Poppins', 'Hind Siliguri', sans-serif; background: var(--bg); margin: 0; padding: 15px; overflow-x: hidden; }
        
        /* User Profile Section */
        .user-header { display: flex; align-items: center; gap: 15px; background: white; padding: 15px; border-radius: 20px; margin-bottom: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.03); }
        .user-header img { width: 50px; height: 50px; border-radius: 50%; border: 2px solid var(--blue); }
        .user-info h4 { margin: 0; font-size: 16px; color: #333; }
        .user-info p { margin: 0; font-size: 12px; color: #888; }

        .card { background: white; padding: 25px; border-radius: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.04); margin-bottom: 15px; }
        .balance-card { background: linear-gradient(135deg, #0088cc, #0055ff); color: white; padding: 25px; border-radius: 25px; display: flex; justify-content: space-between; align-items: center; }
        .bal-val { font-size: 26px; font-weight: 800; }
        
        input, select { width: 100%; padding: 20px; margin: 12px 0; border: 2px solid #e0e6ed; border-radius: 20px; font-size: 17px; font-weight: 600; box-sizing: border-box; }
        label { font-weight: 700; font-size: 15px; color: #444; margin-left: 10px; display: block; }

        .space-modal { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background: #0b0e14; z-index: 2000; align-items: center; justify-content: center; flex-direction: column; color: white; text-align: center; }
        .planet { width: 90px; height: 90px; background: radial-gradient(circle at 30% 30%, #4facfe, #00f2fe); border-radius: 50%; animation: travel 2s ease-in-out infinite; }
        @keyframes travel { 0% { transform: scale(0.5) translateX(-120px); opacity:0; } 50% { transform: scale(1.3) translateX(0); opacity:1; } 100% { transform: scale(0.5) translateX(120px); opacity:0; } }

        .screen { display: none; }
        .active-screen { display: block; animation: fadeIn 0.5s; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .btn { width: 100%; padding: 20px; border: none; border-radius: 20px; font-size: 17px; font-weight: 700; cursor: pointer; margin-top: 10px; }
        .btn-blue { background: var(--blue); color: white; }
        .btn-green { background: var(--green); color: white; }
        
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 3000; align-items: center; justify-content: center; }
        .modal-content { background: white; width: 85%; padding: 30px; border-radius: 30px; text-align: center; }
        
        .coin-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 15px; }
        .coin-box { background: white; padding: 20px; border-radius: 22px; text-align: center; border: 1px solid #eef2f6; }
    </style>
</head>
<body>

    <div id="subModal" class="modal">
        <div class="modal-content">
            <i class="fab fa-telegram fa-4x" style="color: var(--blue); margin-bottom: 15px;"></i>
            <h2 style="margin: 0;">চ্যানেল সাবস্ক্রাইব করুন</h2>
            <p style="color: #666; font-size: 14px; margin: 15px 0;">আমাদের টেলিগ্রাম চ্যানেলে জয়েন না থাকলে পেমেন্ট পাবেন না। দ্রুত জয়েন করুন।</p>
            <a href="https://t.me/earning_hub_bdt" class="btn btn-blue" style="display:block; text-decoration:none;">JOIN NOW</a>
            <button class="btn" style="background:#eee; margin-top:10px;" onclick="closeSub()">বন্ধ করুন</button>
            <p style="font-size:12px; color:var(--red); cursor:pointer; text-decoration:underline; margin-top:10px;" onclick="muteSub()">১৫ মিনিটের জন্য বন্ধ করুন</p>
        </div>
    </div>

    <div id="spaceTransition" class="space-modal">
        <div class="planet"></div>
        <p id="animText" style="margin-top:25px; font-weight: 600;">TRAVELING...</p>
    </div>

    <div id="homeScreen" class="screen active-screen">
        <div class="user-header">
            <img id="userPic" src="https://cdn-icons-png.flaticon.com/512/149/149071.png">
            <div class="user-info">
                <h4 id="userName">Telegram User</h4>
                <p>ID: <span id="userId">00000000</span></p>
            </div>
        </div>
        
        <div class="balance-card">
            <div><small>ব্যালেন্স</small><div class="bal-val">৳ 0.00</div></div>
            <div style="text-align:right"><small>উইথড্র</small><div class="bal-val">৳ 0.00</div></div>
        </div>

        <div class="coin-grid" id="marketGrid"></div>

        <button class="btn btn-blue" onclick="showScreenWithSpace('sellScreen', 'GOING TO SELL PLANET...')">SELL COIN NOW</button>
        <button class="btn btn-blue" style="background:#fff; color:var(--blue); border:2px solid var(--blue);" onclick="showScreenWithSpace('withdrawScreen', 'GOING TO CASH PLANET...')">WITHDRAW NOW</button>
    </div>

    <div id="sellScreen" class="screen">
        <div class="card">
            <h3>Sell Coins</h3>
            <label>Select Coin</label>
            <select id="coinSelect" onchange="updateSellUI()">
                <option value="5.60">NIVA COIN</option>
                <option value="5.60">TOP COIN</option>
                <option value="14.00">NS COIN</option>
            </select>
            
            <div style="background:#f0f7ff; padding:20px; border-radius:20px; text-align: center; border:2px dashed var(--blue);">
                <small>Send Coin to:</small><br>
                <b id="targetUser" style="font-size:22px; color:var(--blue);">niva_coin_eh</b> 
            </div>

            <label>Amount</label>
            <input type="number" id="sellQty" placeholder="কত কয়েন সেল করবেন? (Min 10,000)">
            
            <div id="instaField">
                <label>Instagram Username</label>
                <input type="text" id="sellUser" placeholder="যে আইডি থেকে কয়েন পাঠিয়েছেন">
            </div>
            
            <button class="btn btn-blue" onclick="showSellPreview()">পরবর্তী ধাপে যান</button>
            <button class="btn" style="background:#eee;" onclick="showScreenWithSpace('homeScreen')">Back</button>
        </div>
    </div>

    <div id="withdrawScreen" class="screen">
        <div class="card">
            <div style="text-align:center; padding:15px; background:#e3f2fd; border-radius:15px; font-weight:800;">ব্যালেন্স: ৳ 0.00</div>
            <label>উইথড্র মেথড</label>
            <select id="wMethod"><option value="bkash">Bkash Personal</option></select>
            <input type="number" id="wAmount" placeholder="টাকার পরিমান">
            <input type="text" id="wNumber" placeholder="নাম্বার দিন">
            <button class="btn btn-blue" onclick="alert('Insufficient Balance')">Confirm Withdraw</button>
            <button class="btn" style="background:#eee;" onclick="showScreenWithSpace('homeScreen')">Back</button>
        </div>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        // ইউজার তথ্য সেট করা
        window.onload = () => {
            if(tg.initDataUnsafe && tg.initDataUnsafe.user) {
                const user = tg.initDataUnsafe.user;
                document.getElementById('userName').innerText = user.first_name + (user.last_name ? " " + user.last_name : "");
                document.getElementById('userId').innerText = user.id;
                if(user.photo_url) document.getElementById('userPic').src = user.photo_url;
            }
            renderMarket();
            
            // সাবস্ক্রাইব পপআপ লজিক
            const muteTime = localStorage.getItem('subMute');
            if(!muteTime || Date.now() > muteTime) {
                document.getElementById('subModal').style.display = 'flex';
            }
        };

        function closeSub() { document.getElementById('subModal').style.display = 'none'; }
        function muteSub() { 
            localStorage.setItem('subMute', Date.now() + 15 * 60 * 1000); 
            closeSub(); 
        }

        function showScreenWithSpace(screenId, text = "TRAVELING...") {
            const space = document.getElementById('spaceTransition');
            document.getElementById('animText').innerText = text;
            space.style.display = 'flex';
            setTimeout(() => {
                space.style.display = 'none';
                document.querySelectorAll('.screen').forEach(s => s.classList.remove('active-screen'));
                document.getElementById(screenId).classList.add('active-screen');
            }, 2000);
        }

        function updateSellUI() {
            const coin = document.getElementById('coinSelect');
            const target = document.getElementById('targetUser');
            const instaField = document.getElementById('instaField');
            
            if(coin.options[coin.selectedIndex].text === "TOP COIN") {
                target.innerText = "VOUCHER_MODE";
                instaField.style.display = "none";
            } else {
                instaField.style.display = "block";
                target.innerText = (coin.value === "14.00") ? "ns_coin_eh" : "niva_coin_eh";
            }
        }

        function showSellPreview() {
            const qty = document.getElementById('sellQty').value;
            if(qty < 10000) return alert("মিনিমাম ১০,০০০ কয়েন লাগবে!");
            alert("রিকোয়েস্ট সফল হয়েছে! প্রতিনিধি চেক করে ব্যালেন্স দিয়ে দিবে।");
            showScreenWithSpace('homeScreen');
        }

        function renderMarket() {
            const coins = [
                {n: 'NIVA COIN', p: '5.60', s: 'Active'}, {n: 'TOP COIN', p: '5.60', s: 'Active'},
                {n: 'NS COIN', p: '14.00', s: 'Active'}, {n: 'FIRA COIN', p: 'OFF', s: 'Closed'}
            ];
            let h = '';
            coins.forEach(c => {
                h += `<div class="coin-box"><b>${c.n}</b><div class="coin-price">${c.p}৳</div><small style="color:${c.s=='Active'?'green':'red'}; font-weight:bold;">${c.s}</small></div>`;
            });
            document.getElementById('marketGrid').innerHTML = h;
        }
    </script>
</body>
</html>
